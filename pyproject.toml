[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LiNCoT"
version = "0.1.0"
description = "LiNCot, A Lightweight Neuronavigation Coordination Toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mne",
    "nibabel",
    "numpy",
    "PySide6",
    "pyvista",
    "pyvistaqt",
    "scipy",
]

[project.scripts]
LiNCoT = "launcher:main"

[tool.setuptools]
py-modules = ["launcher"]

[tool.setuptools.packages.find]
include = ["core*", "cli*", "gui*", "registry*", "backends*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
